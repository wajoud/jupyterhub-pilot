name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]" psutil ipython
      - run: flake8 jupyterhub_pilot tests
      - run: mypy jupyterhub_pilot
      - run: pytest -q
      - run: for f in jupyterhub_pilot/scripts/*.sh; do bash -n "$f"; done
