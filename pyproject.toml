[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "jupyterhub-pilot"
version = "0.7.0"
description = "Agentic AI coding partner for JupyterHub and IPython"
readme = {file = "PYPI.md", content-type = "text/markdown"}  # short page for PyPI; the guides are in docs/
requires-python = ">=3.9"
license = {file = "LICENSE"}
authors = [
    {name = "Wajoud", email = "wajoudnoorani59@gmail.com"}
]
keywords = [
    "jupyter",
    "jupyterhub",
    "ai",
    "llm",
    "ipython",
    "magic-commands",
    "ssh-spawner"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Framework :: Jupyter",
]
dependencies = [
    # Core dependencies used by both hub and worker
    "requests>=2.32.0",
]

[project.urls]
Homepage = "https://github.com/wajoud/jupyterhub-pilot"
Repository = "https://github.com/wajoud/jupyterhub-pilot.git"
"Bug Tracker" = "https://github.com/wajoud/jupyterhub-pilot/issues"
"AWS EC2 Deployment" = "https://github.com/wajoud/jupyterhub-pilot/blob/main/AWS_EC2_DEPLOYMENT.md"
"Vault Integration" = "https://github.com/wajoud/jupyterhub-pilot/blob/main/docs/SECURITY.md#4-vault-secret-injection"
"Monitoring Dashboard" = "https://github.com/wajoud/jupyterhub-pilot/blob/main/docs/MONITORING.md"

[project.optional-dependencies]
# Hub-side dependencies: pip install jupyterhub_pilot[hub]
hub = [
    "jupyterhub>=5.3,<7",  # 5.3+: shared-password test login; tested on 6.2
    "oauthenticator>=16.0",  # Google login
    "jupyterhub-idle-culler>=1.4",  # stops idle servers (hub_settings "idle_cull")
    "paramiko>=3.4.0,<6.0",
    "websockets>=12.0",
]
# Worker-side dependencies: pip install jupyterhub_pilot[worker]
worker = [
    "jupyterhub>=5.3,<7",  # 5.3+: shared-password test login; tested on 6.2
    "notebook>=7.0.0",
    "psutil>=6.0.0",
    "websockets>=12.0",
    # Same data stack on every worker, so a notebook runs the same on any team's worker.
    # shortcut: lower bounds, not exact pins; workers installed months apart can differ
    # until `jupyterhub-pilot upgrade` runs on all of them. Pin exactly if that bites.
    "pandas>=2.2",
    "polars>=1.0",
    "duckdb>=1.1",
    "duckdb-engine>=0.13",  # lets jupysql's %sql talk to DuckDB
    "jupysql>=0.10",
    "scikit-learn>=1.5",
    "matplotlib>=3.8",
    "plotly>=5.20",
    "papermill>=2.6",  # %schedule runs notebooks with it
    "jupyterlab-git>=0.50",  # Git panel in JupyterLab (needs the git package, install-worker adds it)
    "nbdime>=4.0",  # readable notebook diffs
]
# Install AI features: pip install jupyterhub_pilot[ai]
ai = [
    "ipython>=8.26.0",
    "litellm>=1.55.0",
    "mcp>=1.0.0,<3.0",
]
dev = [
    "black",
    "pytest",
    "pytest-anyio",
    "anyio",
    "mypy",
    "flake8",
    "types-requests",
    "types-paramiko",
    "tornado",        # needed by test_config.py → jupyterhub_config → monitoring_handler
    "jinja2",         # test_pages.py renders the Limits template
]

[tool.setuptools.packages.find]
where = ["."]
include = ["jupyterhub_pilot*"]

# Non-.py files the package needs at runtime: dashboard, Hub templates, setup scripts
[tool.setuptools.package-data]
jupyterhub_pilot = ["static/*.html", "templates/*.html", "scripts/*.sh"]

[project.scripts]
jupyterhub-pilot = "jupyterhub_pilot.cli:main"
