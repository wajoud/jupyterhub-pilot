[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "jupyterhub-pilot"
version = "0.3.1"
description = "Agentic AI coding partner for JupyterHub and IPython"
readme = "README.md"
requires-python = ">=3.9"
license = {file = "LICENSE"}
authors = [
    {name = "Wajoud", email = "wajoudnoorani59@gmail.com"}
]
keywords = [
    "jupyter",
    "jupyterhub",
    "ai",
    "llm",
    "ipython",
    "magic-commands",
    "ssh-spawner"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Framework :: Jupyter",
]
dependencies = [
    # Core dependencies used by both hub and worker
    "requests>=2.32.0",
]

[project.urls]
Homepage = "https://github.com/wajoud/jupyterhub-pilot"
Repository = "https://github.com/wajoud/jupyterhub-pilot.git"
"Bug Tracker" = "https://github.com/wajoud/jupyterhub-pilot/issues"
"AWS EC2 Deployment" = "https://github.com/wajoud/jupyterhub-pilot/blob/main/AWS_EC2_DEPLOYMENT.md"
"Vault Integration" = "https://github.com/wajoud/jupyterhub-pilot/blob/main/docs/SECURITY.md#4-vault-secret-injection"
"Monitoring Dashboard" = "https://github.com/wajoud/jupyterhub-pilot/blob/main/docs/MONITORING.md"

[project.optional-dependencies]
# Hub-side dependencies: pip install jupyterhub_pilot[hub]
hub = [
    "jupyterhub>=5.0.0",
    "paramiko>=3.4.0,<6.0",
    "websockets>=12.0",
]
# Worker-side dependencies: pip install jupyterhub_pilot[worker]
worker = [
    "jupyterhub>=5.0.0",
    "notebook>=7.0.0",
    "psutil>=6.0.0",
    "websockets>=12.0",
]
# Install AI features: pip install jupyterhub_pilot[ai]
ai = [
    "ipython>=8.26.0",
    "litellm>=1.55.0",
    "mcp>=1.0.0,<3.0",
]
dev = [
    "black",
    "pytest",
    "pytest-anyio",
    "anyio",
    "mypy",
    "flake8",
    "types-requests",
    "types-paramiko",
    "tornado",        # needed by test_config.py → jupyterhub_config → monitoring_handler
]

[tool.setuptools.packages.find]
where = ["."]
include = ["jupyterhub_pilot*"]

# Ship the monitoring dashboard page (not a .py file, so not included by default)
[tool.setuptools.package-data]
jupyterhub_pilot = ["static/*.html"]
